ext {
    version = '0.5.1'
    kotlin_version = '1.5.0' // https://github.com/JetBrains/kotlin
}

repositories {
    google()
    mavenCentral()
}

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'kotlin-android-extensions'

android {
    compileSdkVersion 28

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
    }

    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 27
        def split = project.ext.version.toString().split('\\.')
        versionCode = (split[0].toInteger() << 16) + (split[1].toInteger() << 8) + (split[2].toInteger())
        versionName project.ext.version.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }

        android.applicationVariants.all { variant ->
            variant.outputs.all {
                if (variant.buildType.name.equals('release')) {
                    // 自定义输出路径
                    variant.getPackageApplication().outputDirectory = new File(project.rootDir.absolutePath + File.separator + "apk")
                    outputFileName = "floating-camera-${variant.versionName}.apk"
                }
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.1.0' // https://developer.android.com/jetpack/androidx/releases/appcompat
    implementation 'com.google.android.material:material:1.1.0' // https://github.com/material-components/material-components-android
    implementation 'androidx.preference:preference:1.1.1' // https://developer.android.com/jetpack/androidx/releases/preference
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.0.0' // https://developer.android.com/jetpack/androidx/releases/localbroadcastmanager
}
